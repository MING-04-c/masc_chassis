/**:
  ros__parameters:
    # PID gains for planar position (m -> m/s) and heading (rad -> rad/s).
    kp_xy: 0.8
    ki_xy: 0.0
    kd_xy: 0.05
    kp_yaw: 1.2
    ki_yaw: 0.0
    kd_yaw: 0.05

    # Stop thresholds. Inside both deadbands the controller publishes zero velocity.
    position_deadband: 0.002
    yaw_deadband: 0.001

    # Output limits.
    # 线速度上限：0.01 m/s = 1 cm/s
    max_linear_speed: 0.05
    max_angular_speed: 0.8
    integral_limit: 1.0
    control_period: 0.02
